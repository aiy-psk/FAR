            `).join('');
        }

        function setFilterDay(d) { filterDay = d; renderDaySelector(); renderRoomStatus(); }
        function setFilterPeriod(p) { filterPeriod = p; renderPeriodSelector(); renderRoomStatus(); }

        function renderRoomStatus() {
            const grid = document.getElementById('roomStatusGrid');
            
            grid.innerHTML = data.rooms.map(room => {
                let busyBy = null;
                // ลูปเช็กทุกคลาสในระบบว่ามีใครใช้ห้องนี้ในวันและคาบที่เลือกไหม
                Object.keys(data.schedules).forEach(cls => {
                    const booking = data.schedules[cls][filterDay]?.[filterPeriod];
                    if (booking && booking.rm === room) {
                        busyBy = cls;
                    }
                });

                const isVacant = !busyBy;
                return `
                    <div class="p-4 rounded-2xl border-2 transition-all ${isVacant ? 'bg-white border-green-200' : 'bg-slate-50 border-transparent opacity-60'}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-slate-700">${room}</span>
                            <div class="w-2 h-2 rounded-full ${isVacant ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 'bg-red-400'}"></div>
                        </div>
                        <div class="text-[9px] font-bold ${isVacant ? 'text-green-500' : 'text-slate-400'}">
                            ${isVacant ? '🟢 ວ່າງ' : '🔴 ' + busyBy}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('th-TH');
        }

        init();











    </script>
</body>
</html>
